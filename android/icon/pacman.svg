<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source artwork for the Android launcher icon.

  The Pac-Man is the classic arcade pose: mouth open to the right, one eye.
  The geometry is the one used by app/assets/icons/pacman.svg, scaled up and
  re-centred so the launcher crop keeps it in the middle.

  This file is the legacy (pre-API-26) icon: a black rounded square with the
  Pac-Man on top. The adaptive icon (API 26+) uses
  package/res/drawable/ic_launcher_foreground.xml plus a solid background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Pac-Man launcher icon</title>
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#000000"/>
  <path d="M 256 256 L 394.6 336 A 160 160 0 1 1 394.6 176 Z" fill="#ffff00"/>
  <circle cx="291.6" cy="202.7" r="19.6" fill="#000000"/>
</svg>
